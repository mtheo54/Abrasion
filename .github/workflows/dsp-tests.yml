name: Tests DSP Micro-Contact

on:
  push:
  pull_request:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler les tests
        run: g++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Wpedantic MicroContact/tests/dsp_smoke_test.cpp -o dsp_smoke_test

      - name: Lancer les tests
        run: ./dsp_smoke_test

      - name: Lancer les tests sous sanitizers
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer MicroContact/tests/dsp_smoke_test.cpp -o dsp_smoke_test_asan
          ./dsp_smoke_test_asan
