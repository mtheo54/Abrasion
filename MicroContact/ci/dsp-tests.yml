# Rejoue les tests du moteur Micro-Contact à chaque push.
# À placer dans .github/workflows/dsp-tests.yml (à côté des workflows du modèle iPlug2OOS).
name: Tests DSP Micro-Contact

on:
  push:
  pull_request:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler les tests (avertissements stricts)
        run: g++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Wpedantic MicroContact/tests/dsp_smoke_test.cpp -o dsp_smoke_test

      - name: Lancer les tests
        run: ./dsp_smoke_test

      - name: Lancer les tests sous sanitizers (mémoire et comportements indéfinis)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer MicroContact/tests/dsp_smoke_test.cpp -o dsp_smoke_test_asan
          ./dsp_smoke_test_asan
